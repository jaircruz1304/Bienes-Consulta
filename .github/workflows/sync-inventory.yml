name: Sincronizar inventario

on:
  workflow_dispatch:
  repository_dispatch:
    types: [inventory_changed]
  schedule:
    - cron: '*/15 * * * *'

permissions:
  id-token: write
  contents: write

concurrency:
  group: sync-inventory
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      AZURE_CORE_OUTPUT: none
      GRAPH_DRIVE_ID: ${{ vars.GRAPH_DRIVE_ID }}
      GRAPH_ITEM_ID: ${{ vars.GRAPH_ITEM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Login Microsoft Entra con OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Obtener token de Microsoft Graph
        id: graph
        shell: bash
        run: |
          TOKEN=$(az account get-access-token --resource-type ms-graph --query accessToken -o tsv)
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Consultar versión del Excel
        id: source
        shell: bash
        env:
          GRAPH_TOKEN: ${{ steps.graph.outputs.token }}
        run: |
          set -euo pipefail
          test -n "$GRAPH_DRIVE_ID"
          test -n "$GRAPH_ITEM_ID"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GRAPH_TOKEN" \
            "https://graph.microsoft.com/v1.0/drives/$GRAPH_DRIVE_ID/items/$GRAPH_ITEM_ID?%24select=id,name,eTag,lastModifiedDateTime,size" \
            -o /tmp/source.json
          python3 - <<'PY'
          import json, os
          x=json.load(open('/tmp/source.json',encoding='utf-8'))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('etag='+str(x.get('eTag','')).replace('\n','')+'\n')
              f.write('modified='+str(x.get('lastModifiedDateTime','')).replace('\n','')+'\n')
              f.write('name='+str(x.get('name','Inventario.xlsx')).replace('\n','')+'\n')
          PY

      - name: Determinar si existen cambios
        id: changed
        shell: bash
        env:
          NEW_ETAG: ${{ steps.source.outputs.etag }}
        run: |
          OLD_ETAG=$(python3 - <<'PY'
          import json
          try:
              print(json.load(open('data/source-meta.json',encoding='utf-8')).get('sourceETag',''))
          except Exception:
              print('')
          PY
          )
          if [ "$NEW_ETAG" = "$OLD_ETAG" ] && [ -s data/assets.json ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "El Excel no cambió. No se modifica el JSON."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Cambio detectado. Se regenerará el JSON."
          fi

      - name: Descargar Excel oficial
        if: steps.changed.outputs.changed == 'true'
        shell: bash
        env:
          GRAPH_TOKEN: ${{ steps.graph.outputs.token }}
        run: |
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GRAPH_TOKEN" \
            "https://graph.microsoft.com/v1.0/drives/$GRAPH_DRIVE_ID/items/$GRAPH_ITEM_ID/content" \
            -o inventory-source.xlsx
          test -s inventory-source.xlsx

      - name: Configurar Python
        if: steps.changed.outputs.changed == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Instalar dependencias
        if: steps.changed.outputs.changed == 'true'
        run: python -m pip install -r requirements.txt

      - name: Construir JSON
        if: steps.changed.outputs.changed == 'true'
        env:
          SOURCE_ETAG: ${{ steps.source.outputs.etag }}
          SOURCE_LAST_MODIFIED: ${{ steps.source.outputs.modified }}
          SOURCE_NAME: ${{ steps.source.outputs.name }}
        run: python scripts/build_assets.py inventory-source.xlsx --output data/assets.json

      - name: Validar JSON
        if: steps.changed.outputs.changed == 'true'
        run: python scripts/validate_assets.py data/assets.json

      - name: Publicar solo si cambió el resultado
        if: steps.changed.outputs.changed == 'true'
        shell: bash
        run: |
          rm -f inventory-source.xlsx
          if git diff --quiet -- data/assets.json data/source-meta.json; then
            echo "El contenido publicado no cambió. No se genera commit."
            exit 0
          fi
          git config user.name "FIAS Inventory Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/assets.json data/source-meta.json
          git commit -m "chore(inventario): sincronización automática"
          git push
