name: Verificar fotografías

on:
  workflow_dispatch:
  schedule:
    - cron: '25 8 * * *'

permissions:
  id-token: write
  contents: write

concurrency:
  group: bienes-consulta-sync
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    env:
      AZURE_CORE_OUTPUT: none
      GRAPH_DRIVE_ID: ${{ vars.GRAPH_DRIVE_ID }}
      GRAPH_ITEM_ID: ${{ vars.GRAPH_ITEM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Login Microsoft Entra con OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Obtener token de Microsoft Graph
        id: graph
        shell: bash
        run: |
          TOKEN=$(az account get-access-token --resource-type ms-graph --query accessToken -o tsv)
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Consultar metadatos del Excel
        id: source
        shell: bash
        env:
          GRAPH_TOKEN: ${{ steps.graph.outputs.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GRAPH_TOKEN" \
            "https://graph.microsoft.com/v1.0/drives/$GRAPH_DRIVE_ID/items/$GRAPH_ITEM_ID?%24select=id,name,eTag,lastModifiedDateTime" \
            -o /tmp/source.json
          python3 - <<'PY'
          import json, os
          x=json.load(open('/tmp/source.json',encoding='utf-8'))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('etag='+str(x.get('eTag','')).replace('\n','')+'\n')
              f.write('modified='+str(x.get('lastModifiedDateTime','')).replace('\n','')+'\n')
              f.write('name='+str(x.get('name','Inventario.xlsx')).replace('\n','')+'\n')
          PY

      - name: Descargar Excel oficial
        shell: bash
        env:
          GRAPH_TOKEN: ${{ steps.graph.outputs.token }}
        run: |
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GRAPH_TOKEN" \
            "https://graph.microsoft.com/v1.0/drives/$GRAPH_DRIVE_ID/items/$GRAPH_ITEM_ID/content" \
            -o inventory-source.xlsx
          test -s inventory-source.xlsx

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Verificar originales y actualizar copias locales
        env:
          GRAPH_TOKEN: ${{ steps.graph.outputs.token }}
        run: python scripts/sync_photos.py inventory-source.xlsx --refresh-all

      - name: Determinar si alguna fotografía cambió
        id: changed
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- data/photos-manifest.json assets/bienes)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Las fotografías de origen no cambiaron."
          fi

      - name: Actualizar JSON con las nuevas versiones de fotografía
        if: steps.changed.outputs.changed == 'true'
        env:
          SOURCE_ETAG: ${{ steps.source.outputs.etag }}
          SOURCE_LAST_MODIFIED: ${{ steps.source.outputs.modified }}
          SOURCE_NAME: ${{ steps.source.outputs.name }}
        run: |
          python scripts/build_assets.py inventory-source.xlsx --output data/assets.json
          python scripts/validate_assets.py data/assets.json

      - name: Publicar fotografías actualizadas
        if: steps.changed.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f inventory-source.xlsx
          git config user.name "FIAS Inventory Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/bienes data/photos-manifest.json data/assets.json data/source-meta.json
          git commit -m "chore(fotos): actualizar imágenes de bienes"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
